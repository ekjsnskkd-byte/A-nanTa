name: Research Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ananta-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install small research core
        run: python -m pip install -e ".[dev]"
      - name: Static analysis
        run: python -m ruff check src tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Synthetic input schema check
        run: ananta validate-data --csv examples/synthetic_m1.csv
      - name: Synthetic ensemble smoke
        run: ananta demo --csv examples/synthetic_m1.csv --round-trip-cost-bps 8
