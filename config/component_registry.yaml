schema_version: 2
purpose: "Seven selected Quant methods only; status means selected, not integrated."
components:
  - id: ms_ar
    upstream: "https://www.statsmodels.org/stable/generated/statsmodels.tsa.regime_switching.markov_autoregression.MarkovAutoregression.html"
    technology: "Markov-Switching Autoregression: regime-conditioned return/direction prediction"
    status: selected_not_integrated
  - id: kalman_trend
    upstream: "https://www.statsmodels.org/stable/generated/statsmodels.tsa.statespace.structural.UnobservedComponents.html"
    technology: "State-space Kalman filtered local linear trend"
    status: selected_not_integrated
  - id: egarch
    upstream: "https://arch.readthedocs.io/en/stable/univariate/forecasting.html"
    technology: "EGARCH conditional volatility forecasting"
    status: selected_not_integrated
  - id: statistical_jump_model
    upstream: "https://github.com/Yizhan-Oliver-Shu/jump-models"
    technology: "Online market-regime classification; train on historical folds"
    status: selected_not_integrated
  - id: bocpd
    upstream: "https://github.com/hildensia/bayesian_changepoint_detection"
    technology: "Bayesian online change point detection"
    status: selected_not_integrated
  - id: historical_pattern_matching
    upstream: "https://github.com/stumpy-dev/stumpy"
    supplementary: "https://tslearn.readthedocs.io/"
    technology: "Past-only nearest-neighbor / DTW motif retrieval and forward outcome statistics"
    status: selected_not_integrated
  - id: first_passage
    upstream: "https://docs.scipy.org/doc/scipy/"
    technology: "First passage TP-before-SL probability and expected holding-time solver"
    status: selected_not_integrated
    note: "Mathematical method; SciPy is numerical tooling, not a ready-made market first-passage model."
