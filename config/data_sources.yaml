schema_version: 1
duka_excluded: true
notes: "Candidates only; verify terms and history coverage before integration"
forex:
  primary: [mt5_broker, histdata]
  fallback: [truefx, fxcm]
metals:
  primary: [mt5_broker, histdata]
  fallback: [independent_broker]
cfds:
  primary: [mt5_broker]
  fallback: [licensed_proxy]
crypto:
  primary: [cryptohftdata, exchange_public_archives]
  fallback: [okx, binance]
requirements:
  - utc_and_source_provenance
  - point_in_time_availability
  - bid_ask_when_available
  - no_silent_fill_of_missing_ticks
  - separate_broker_execution_costs
